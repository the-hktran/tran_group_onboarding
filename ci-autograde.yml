name: Onboarding Bootcamp CI Autograder

on:
  push:
    branches: [ "main", "onboarding/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install scientific Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest ruff

      - name: Verify Module 01 Bash log parser
        run: |
          chmod +x parse_scf_logs.sh test_parser.sh
          ./test_parser.sh

      - name: Run Pytest verification suite (Modules 03-08)
        run: pytest -v
